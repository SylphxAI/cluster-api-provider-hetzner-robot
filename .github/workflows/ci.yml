name: CI

# Merge-queue gate (docs/optimistic-merge.md): gofmt on changed files and a
# build. `go test ./...` runs in verify.yml (ready pull requests and after merge).
# The image is built by build.yml on main. `ci-ok` is the one required status check.

# A change is tested on its pull request and again in the merge queue (the
# queue tests the merged result). Branch pushes without a pull request are not
# tested; open a pull request.
on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stop the line while the trunk's newest Verify run is red and its way back is in
  # motion. Merge groups only; ships in observe mode.
  main-state:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/main-red-gate@05ac6474b96425bcb4965addd025a93e061b66c4
        with:
          mode: observe

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # owner#750 (zero metered GitHub spend): a public repository may use
      # GitHub's free standard hosted runners; larger and GPU hosted runners
      # are banned everywhere.
      - name: No larger or GPU GitHub-hosted runners
        run: |
          if grep -rnE '(ubuntu|windows|macos)-[a-z0-9.-]*(cores|xlarge|large|gpu)' .github/workflows | grep -v '^[^:]*:[0-9]*:[[:space:]]*#'; then
            echo "::error::larger or GPU GitHub-hosted runners are banned (owner#750)"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git merge-base origin/main HEAD)"
            fi
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.go')
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi

          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: |
          go build ./...

  # The full suite on a pull request that is ready; never in a merge group or a draft.
  suite:
    if: github.event_name != 'merge_group' && !github.event.pull_request.draft
    uses: ./.github/workflows/verify.yml

  # No new departure from the default stack (docs/stack-conformance.md in
  # SylphxAI/.github): a backend service off Rust or a migration engine other
  # than atlas fails unless .github/stack-departures.txt, which may only
  # shrink, already lists it. Reads git objects only; a few seconds.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          filter: blob:none
      - uses: SylphxAI/.github/.github/actions/stack-conformance@bc664ac7410c00d233fe4f729b6747969a4a9bed # SylphxAI/.github#208
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}

  # The one required check: fails unless every job above succeeded.
  ci-ok:
    if: always()
    needs: [main-state, lint, suite, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@05ac6474b96425bcb4965addd025a93e061b66c4
        with:
          needs: ${{ toJSON(needs) }}
          required: lint
          required-unless-merge-group: ${{ github.event.pull_request.draft && ' ' || 'suite' }}
