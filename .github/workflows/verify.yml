# Post-merge suite for optimistic merge (docs/optimistic-merge.md): the Go tests run on
# each push to main and on a pull request marked ready (ci.yml calls this file).
# The `verified` job is the marker Release reads. Public repository: GitHub-hosted
# standard runners only.
name: Verify

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...

  # The marker. Named exactly `verified`; never a required check.
  verified:
    name: verified
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@46ec433892bca8693193049b5ee7441bb916a7ad # main
        with:
          needs: ${{ toJSON(needs) }}
          required: test
